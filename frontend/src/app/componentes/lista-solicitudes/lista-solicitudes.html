<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">
      <i class="pi pi-list-check me-2"></i>Mis Solicitudes
    </h1>
    <a routerLink="/nueva-solicitud" class="text-decoration-none">
      <p-button label="Nueva solicitud" icon="pi pi-plus" severity="primary" size="small" [raised]="true" />
    </a>
  </div>

  @if (cargando()) {
    <div class="d-flex justify-content-center my-5">
      <p-progressSpinner strokeWidth="4" />
    </div>
  } @else {
    <p-table [value]="solicitudes()" stripedRows [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template #header>
        <tr>
          <th>Código</th>
          <th>Tipo</th>
          <th>Estado</th>
          <th>Prioridad</th>
          <th>Fecha</th>
        </tr>
      </ng-template>

      <ng-template #body let-solicitud>
        <tr>
          <td><strong>{{ solicitud.codigo }}</strong></td>
          <td>{{ solicitud.tipo }}</td>
          <td>
            <p-tag [value]="solicitud.estado"
                   [severity]="tagSeveridadEstado(solicitud.estado)" />
          </td>
          <td>
            <p-tag [value]="solicitud.prioridad ?? 'Pendiente'"
                   [severity]="tagSeveridadPrioridad(solicitud.prioridad)" />
          </td>
          <td>{{ solicitud.fechaCreacion | slice:0:10 }}</td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="5" class="text-center py-4">
            <i class="pi pi-inbox" style="font-size: 2rem"></i>
            <p class="mt-2 text-muted">No hay solicitudes registradas.</p>
          </td>
        </tr>
      </ng-template>
    </p-table>

    <p-paginator
      [rows]="size()"
      [totalRecords]="totalElements()"
      [rowsPerPageOptions]="[5, 10, 20]"
      (onPageChange)="onPageChange($event)">
    </p-paginator>
  }
</div>
