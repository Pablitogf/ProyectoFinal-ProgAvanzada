<div class="quantum-form-workspace p-4 d-flex justify-content-center align-items-center">

  <div class="cyber-form-card" [formGroup]="form">

    <div class="form-terminal-header d-flex align-items-center gap-3">
      <div class="terminal-icon-shell">
        <i class="fa-solid fa-file-invoice-dollar text-cyan"></i>
      </div>
      <div>
        <h3 class="terminal-card-title m-0">Nueva Solicitud de Servicio</h3>
        <p class="terminal-card-subtitle m-0">Registra un nuevo requerimiento en el Sistema Integral UQ</p>
      </div>
    </div>

    <div class="form-terminal-body mt-4">

      <div class="input-telemetry-group mb-4">
        <label class="telemetry-field-label">
          <i class="fa-solid fa-cube text-cyan me-2"></i>Tipo de requerimiento
        </label>
        <div class="cyber-input-wrapper">
          <select class="cyber-select-control" formControlName="tipo">
            <option value="" disabled selected>Seleccione una opción...</option>
            <option value="SOPORTE">Soporte Técnico</option>
            <option value="MANTENIMIENTO">Mantenimiento de Redes</option>
            <option value="SOFTWARE">Desarrollo / Software</option>
          </select>
          <div class="select-arrow-cyber"><i class="fa-solid fa-chevron-down"></i></div>
        </div>
      </div>

      <div class="input-telemetry-group mb-4">
        <label class="telemetry-field-label">
          <i class="fa-solid fa-pen-to-square text-cyan me-2"></i>Descripción detallada
        </label>
        <div class="cyber-input-wrapper">
          <textarea
            class="cyber-textarea-control"
            rows="4"
            formControlName="descripcionBreve"
            placeholder="Explique detalladamente su solicitud para brindarle una mejor atención...">
          </textarea>
        </div>
        <div class="field-restriction-tag mt-2" [class.text-danger]="form.get('descripcionBreve')?.invalid && form.get('descripcionBreve')?.touched">
          <i class="fa-solid fa-circle-info me-1"></i> Mínimo 10 caracteres obligatorios.
        </div>
      </div>

      <div class="input-telemetry-group mb-5">
        <label class="telemetry-field-label">
          <i class="fa-solid fa-triangle-exclamation text-cyan me-2"></i>Nivel de prioridad
        </label>
        <div class="priority-matrix-grid">

          <div
            class="priority-node-option priority-low"
            [class.active]="form.get('prioridad')?.value === 'BAJA'"
            (click)="cambiarPrioridad('BAJA')">
            <span class="custom-indicator"></span>
            <span class="node-text">Baja</span>
          </div>

          <div
            class="priority-node-option priority-medium"
            [class.active]="form.get('prioridad')?.value === 'MEDIA'"
            (click)="cambiarPrioridad('MEDIA')">
            <span class="custom-indicator"></span>
            <span class="node-text">Media</span>
          </div>

          <div
            class="priority-node-option priority-high"
            [class.active]="form.get('prioridad')?.value === 'ALTA'"
            (click)="cambiarPrioridad('ALTA')">
            <span class="custom-indicator"></span>
            <span class="node-text">Alta</span>
          </div>

        </div>
      </div>

      <div class="form-action-panel d-flex justify-content-end align-items-center gap-3">
        <button type="button" class="btn-cyber-outline" routerLink="/lista-solicitudes">
          Cancelar
        </button>
        <button
          type="button"
          class="btn-cyber-plasma"
          [disabled]="form.invalid"
          (click)="enviar()">
          <i class="fa-solid fa-cloud-arrow-up me-2"></i>Guardar Solicitud
        </button>
      </div>

    </div>

  </div>
</div>
