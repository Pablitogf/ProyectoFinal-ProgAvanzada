<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <form [formGroup]="form" (ngSubmit)="enviar()" class="card shadow-sm">
        <div class="card-header bg-primary text-white py-3">
          <h1 class="h5 mb-0"><i class="fa-solid fa-file-circle-plus me-2"></i>Nueva Solicitud de Servicio</h1>
        </div>

        <div class="card-body p-4">
          <div class="mb-3">
            <label class="form-label fw-bold">Tipo de requerimiento</label>
            <select formControlName="tipo" class="form-select">
              <option value="">Seleccione una opción...</option>
              <option value="SOPORTE">Soporte Técnico</option>
              <option value="MANTENIMIENTO">Mantenimiento General</option>
              <option value="SOFTWARE">Instalación de Software</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Descripción detallada</label>
            <textarea formControlName="descripcionBreve" class="form-control" rows="3" placeholder="Explique brevemente su solicitud..."></textarea>
            <div class="form-text">Mínimo 10 caracteres para una mejor atención.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold d-block">Nivel de prioridad</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" formControlName="prioridad" value="BAJA" id="baja" autocomplete="off">
              <label class="btn btn-outline-success" for="baja">Baja</label>

              <input type="radio" class="btn-check" formControlName="prioridad" value="MEDIA" id="media" autocomplete="off">
              <label class="btn btn-outline-warning" for="media">Media</label>

              <input type="radio" class="btn-check" formControlName="prioridad" value="ALTA" id="alta" autocomplete="off">
              <label class="btn btn-outline-danger" for="alta">Alta</label>
            </div>
          </div>
        </div>

        <div class="card-footer bg-light p-3 d-flex justify-content-end gap-2">
          <a routerLink="/lista-solicitudes" class="btn btn-secondary">Cancelar</a>
          <button type="submit" [disabled]="form.invalid" class="btn btn-primary px-4">
            <i class="fa-solid fa-cloud-arrow-up me-2"></i>Guardar Solicitud
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
